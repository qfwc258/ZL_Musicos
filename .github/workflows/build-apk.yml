name: Build Release APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install npm dependencies
        run: npm ci

      - name: Build JS bundle
        run: npm run bundle-android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: List APK files
        run: |
          echo "=== Generated APKs ==="
          find android/app/build/outputs/apk -name "*.apk" -type f
          echo "=== APK sizes ==="
          ls -lh android/app/build/outputs/apk/release/*.apk 2>/dev/null || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZL-Music-release-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create Release directory and copy APK
        if: github.event_name == 'push'
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/*.apk release/ 2>/dev/null || true
          ls -lh release/

      - name: Commit APK to release folder
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: 自动提交APK到release目录 [skip ci]"
          file_pattern: 'release/*.apk'
